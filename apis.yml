aid: matrixport
name: Matrixport
description: 'Matrixport is a digital-asset financial services firm whose trading and derivatives
  venue, bit.com, exposes a public v1 REST and WebSocket API for spot, USD-margined (USD-M) and
  coin-margined (COIN-M) futures, perpetual swaps, and options, plus Paradigm-style block trades.
  The API authenticates with an access key and HMAC-SHA256 request signing, and covers market
  data (index, instruments, tickers, orderbooks, klines, funding), account, position, and full
  order-management (new/amend/cancel/close, batch orders, stop orders, MMP). First-party SDKs are
  published for Go, Python, and Java. Added to the API Evangelist network as a crypto-finance
  provider and enriched from its public developer surface and official SDK repositories.'
